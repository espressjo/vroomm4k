MACIEIP 192.168.1.100 # can be set to ANY
#FRAMESIZE 4096
PIXRO 0.00001
#EFFEXPTIME 5.5733
HxRG 2
ASICSERIAL xxx
OBSERVATORY OMM
OBSLOCATION Canada
SCASERIAL xxx
SOFTV 3.0
MCDASIC /opt/cpapir/mcd/HxRG_Cpapir2_ModeA.mcd
MRF /opt/cpapir/mcd/MACIE_Registers_Slow.mrf
USER cpapir
PATH /opt/cpapir/
MACIESLOT 1 # slot 1 or slot 2
PATHCFG /opt/cpapir/config #this is not necessary but it can be usefull
PATHLOG /opt/cpapir/log #this is not necessary but it can be usefull
CUBENAME cube
RAMPNAME ramp
READNAME read
FNINCREMENT T #by default Cube and Ramp will be created with increment
